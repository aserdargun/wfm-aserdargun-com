name: Deploy World Models Atlas

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-wfm-aserdargun-com-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npm exec playwright install --with-deps chromium

      - name: Validate application
        run: npm run validate

      - name: Verify static artifact
        run: |
          test -s dist/tr/index.html
          test -s dist/en/index.html
          test -s dist/staticwebapp.config.json

      - name: Deploy prebuilt artifact
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SWA_WFM_ASERDARGUN_COM }}
          action: upload
          app_location: dist
          api_location: ""
          output_location: ""
          skip_app_build: true
